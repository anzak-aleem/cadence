<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" font-family="-apple-system, system-ui, sans-serif">
  <!-- Screen background -->
  <rect width="400" height="800" fill="#F5F5F4"/>

  <!-- Fake status bar -->
  <text x="32" y="40" font-size="14" font-weight="600" fill="#44403C">9:41</text>
  <g fill="#44403C">
    <circle cx="340" cy="35" r="3"/><circle cx="350" cy="35" r="3"/><circle cx="360" cy="35" r="3"/>
    <rect x="370" y="30" width="14" height="10" rx="2" fill="none" stroke="#44403C" stroke-width="1.5"/>
  </g>

  <!-- Mute toggle: unmuted (bell). Tap to mute. -->
  <g transform="translate(346, 85)">
    <circle r="18" fill="#FFFFFF" stroke="#D6D3D1" stroke-width="1.5"/>
    <g transform="translate(0, -2)" stroke="#44403C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M -6 0 a 6 6 0 0 1 12 0 v 4 l 2 3 h -16 l 2 -3 z" fill="#FFFFFF"/>
      <path d="M -2 8 a 2 2 0 0 0 4 0"/>
    </g>
  </g>

  <!-- App title -->
  <text x="200" y="90" font-size="22" font-weight="700" fill="#1C1917" text-anchor="middle">Cadence</text>
  <text x="200" y="115" font-size="13" fill="#78716C" text-anchor="middle">45 min work · 15 min rest</text>

  <!-- Dial: track underneath -->
  <circle cx="200" cy="290" r="130" fill="none" stroke="#E7E5E4" stroke-width="30"/>

  <!-- Green arc 0 → 45 min (270°, large arc) -->
  <path d="M 200 160 A 130 130 0 1 1 70 290" fill="none" stroke="#16A34A" stroke-width="30" stroke-linecap="butt"/>
  <!-- Red arc 45 → 60 min (90°, small arc) -->
  <path d="M 70 290 A 130 130 0 0 1 200 160" fill="none" stroke="#DC2626" stroke-width="30" stroke-linecap="butt"/>

  <!-- Boundary knob (at 45 min, left side) -->
  <circle cx="70" cy="290" r="9" fill="#FAFAF9" stroke="#1C1917" stroke-width="2"/>

  <!-- Tick marks at quarter points -->
  <g stroke="#FAFAF9" stroke-width="2" fill="none">
    <line x1="200" y1="170" x2="200" y2="180"/>
    <line x1="310" y1="290" x2="320" y2="290"/>
    <line x1="200" y1="400" x2="200" y2="410"/>
    <line x1="80" y1="290" x2="90" y2="290"/>
  </g>

  <!-- Idle: short indicator at 12 (top) instead of full hand, plus dimmed pivot -->
  <line x1="200" y1="195" x2="200" y2="220" stroke="#1C1917" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <circle cx="200" cy="195" r="4" fill="#1C1917" opacity="0.5"/>
  <circle cx="200" cy="290" r="6" fill="#1C1917" opacity="0.3"/>

  <!-- Center label inside dial -->
  <text x="200" y="278" font-size="12" fill="#78716C" text-anchor="middle" font-weight="600">IDLE</text>
  <text x="200" y="312" font-size="30" font-weight="700" fill="#1C1917" text-anchor="middle">0:00</text>
  <text x="200" y="332" font-size="11" fill="#A8A29E" text-anchor="middle">/ 45:00</text>

  <!-- Hint text -->
  <text x="200" y="470" font-size="13" fill="#78716C" text-anchor="middle">Tap a button to begin.</text>

  <!-- Start work button (green) -->
  <rect x="40" y="510" width="320" height="80" rx="40" fill="#16A34A"/>
  <text x="200" y="558" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start work</text>

  <!-- Start rest button (red) -->
  <rect x="40" y="610" width="320" height="80" rx="40" fill="#DC2626"/>
  <text x="200" y="658" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start rest</text>

  <!-- Footer / settings hint -->
  <text x="200" y="740" font-size="11" fill="#A8A29E" text-anchor="middle">Drag the dot on the dial to adjust the split.</text>
</svg>
