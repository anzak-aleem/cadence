<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" font-family="-apple-system, system-ui, sans-serif">
  <rect width="400" height="800" fill="#F5F5F4"/>

  <!-- Status bar -->
  <text x="32" y="40" font-size="14" font-weight="600" fill="#44403C">9:41</text>
  <g fill="#44403C">
    <circle cx="340" cy="35" r="3"/><circle cx="350" cy="35" r="3"/><circle cx="360" cy="35" r="3"/>
    <rect x="370" y="30" width="14" height="10" rx="2" fill="none" stroke="#44403C" stroke-width="1.5"/>
  </g>

  <!-- Mute toggle -->
  <g transform="translate(346, 85)">
    <circle r="18" fill="#FFFFFF" stroke="#D6D3D1" stroke-width="1.5"/>
    <g transform="translate(0, -2)" stroke="#44403C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M -6 0 a 6 6 0 0 1 12 0 v 4 l 2 3 h -16 l 2 -3 z" fill="#FFFFFF"/>
      <path d="M -2 8 a 2 2 0 0 0 4 0"/>
    </g>
  </g>

  <!-- Header -->
  <text x="185" y="90" font-size="22" font-weight="700" fill="#1C1917" text-anchor="middle">Cadence</text>
  <text x="185" y="115" font-size="13" fill="#78716C" text-anchor="middle">45 min work · 15 min rest</text>

  <!-- Dial track -->
  <circle cx="200" cy="290" r="130" fill="none" stroke="#E7E5E4" stroke-width="30"/>

  <!-- Green arc: 0 → 45 min (270°, large arc) -->
  <!-- Start: (200, 160)  End: (70, 290) -->
  <path d="M 200 160 A 130 130 0 1 1 70 290" fill="none" stroke="#16A34A" stroke-width="30"/>

  <!-- Red arc: 45 → 60 min (90°, small arc) -->
  <!-- Start: (70, 290)  End: (200, 160) -->
  <path d="M 70 290 A 130 130 0 0 1 200 160" fill="none" stroke="#DC2626" stroke-width="30"/>

  <!-- Quarter tick marks -->
  <g stroke="#FAFAF9" stroke-width="2" fill="none">
    <line x1="200" y1="170" x2="200" y2="180"/>
    <line x1="310" y1="290" x2="320" y2="290"/>
    <line x1="200" y1="400" x2="200" y2="410"/>
    <line x1="80" y1="290" x2="90" y2="290"/>
  </g>

  <!-- Hand at top (idle) -->
  <line x1="200" y1="290" x2="200" y2="195" stroke="#1C1917" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="290" r="6" fill="#1C1917"/>
  <circle cx="200" cy="195" r="4" fill="#1C1917"/>

  <!-- Work/rest boundary knob at 45 min → (70, 290) -->
  <circle cx="70" cy="290" r="11" fill="#FAFAF9" stroke="#1C1917" stroke-width="2"/>

  <!-- NEW: Rest-end knob at 12 o'clock → (200, 160) — red ring, white fill -->
  <circle cx="200" cy="160" r="11" fill="#FAFAF9" stroke="#DC2626" stroke-width="2.5"/>

  <!-- Callout balloon for the new rest-end knob (upper-right of dial) -->
  <!-- Pointer line from balloon to knob -->
  <line x1="222" y1="152" x2="211" y2="160" stroke="#DC2626" stroke-width="1.5"/>
  <g transform="translate(224, 128)">
    <rect width="138" height="38" rx="8" fill="#DC2626"/>
    <text x="69" y="15" font-size="10" fill="#FECACA" text-anchor="middle">REST-END KNOB  (new)</text>
    <text x="69" y="30" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">drag clockwise to extend</text>
  </g>

  <!-- Label: boundary knob -->
  <line x1="56" y1="285" x2="20" y2="255" stroke="#78716C" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="18" y="248" font-size="10" fill="#78716C" text-anchor="middle">split</text>

  <!-- Readout -->
  <text x="200" y="270" font-size="11" fill="#78716C" text-anchor="middle" font-weight="600">IDLE</text>
  <text x="200" y="302" font-size="30" font-weight="700" fill="#1C1917" text-anchor="middle">0:00</text>
  <text x="200" y="324" font-size="13" fill="#78716C" text-anchor="middle">/ 45:00</text>

  <!-- Hint -->
  <text x="200" y="466" font-size="13" fill="#78716C" text-anchor="middle">White dot = split · Red dot = rest end</text>

  <!-- Buttons -->
  <rect x="40" y="490" width="320" height="68" rx="34" fill="#16A34A"/>
  <text x="200" y="531" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start work</text>

  <rect x="40" y="574" width="320" height="68" rx="34" fill="#DC2626"/>
  <text x="200" y="615" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start rest</text>

  <!-- Footer note -->
  <text x="200" y="680" font-size="11" fill="#A8A29E" text-anchor="middle">Red knob at 12 o'clock = default (no extension).</text>
  <text x="200" y="696" font-size="11" fill="#A8A29E" text-anchor="middle">Extension resets automatically after each rest ends.</text>
</svg>
